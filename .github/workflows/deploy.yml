name: Spring Boot CI/CD to AWS EC2 (Server A & B)

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 1. Checkout Source Code
        uses: actions/checkout@v4

      - name: 2. Set up JDK 17 (Amazon Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'

      - name: 3. Setup Gradle with Caching
        uses: gradle/actions/setup-gradle@v4

      - name: 4. Build Executable bootJar
        run: |
          chmod +x ./gradlew
          ./gradlew clean bootJar -x test
          JAR_FILE=$(ls build/libs/*.jar | grep -v -- '-plain.jar' | head -n 1)
          if [ -z "$JAR_FILE" ]; then
            echo "ERROR: Executable JAR not found in build/libs/"
            exit 1
          fi
          echo "Selected JAR: $JAR_FILE"
          cp "$JAR_FILE" ./app.jar
          ls -lh ./app.jar

      - name: 5. Transfer app.jar to Server B (Worker / Auth / Score)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar"
          target: "/home/ec2-user/Gamgyul_back"
          overwrite: true

      - name: 6. Restart Server B
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_B_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            /home/ec2-user/Gamgyul_back/restart.sh

      - name: 7. Transfer app.jar to Server A (API / Problem Fetch)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "app.jar"
          target: "/home/ec2-user/Gamgyul_back"
          overwrite: true

      - name: 8. Restart Server A
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_A_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          script_stop: true
          script: |
            /home/ec2-user/Gamgyul_back/restart.sh